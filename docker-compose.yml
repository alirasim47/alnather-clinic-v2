services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - clinic_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - clinic_internal

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - clinic_internal

  setup:
    build: .
    profiles: ["setup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      CLINIC_NAME: ${CLINIC_NAME:?Set CLINIC_NAME in .env}
      CLINIC_SLUG: ${CLINIC_SLUG:?Set CLINIC_SLUG in .env}
      ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    command: ["npm", "run", "db:seed-admin"]
    restart: "no"

networks:
  clinic_internal:
    driver: bridge

volumes:
  clinic_postgres:
